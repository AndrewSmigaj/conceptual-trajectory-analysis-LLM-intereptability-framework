# Test Configuration for Apple Quality Routing Experiment
# Reduced parameters for testing and debugging

experiment:
  name: "apple_quality_routing_test"
  type: "classification"  
  description: "TEST: CTA analysis of how neural networks route apple varieties through quality classifications"
  output_dir: "experiments/apple_variety/results/apple_variety_test"
  random_seed: 42

# Use manual labels instead of LLM API
use_manual_labels: true

dataset:
  name: "apple_variety_test"
  data_path: "arxiv_apple/apples_processed.csv"
  min_samples_per_variety: 1  # Use all samples with known routing
  test_size: 0.2
  features:
    # Core quality measurements with minimal missing data
    - "brix_numeric"      # Sugar content (0% missing)
    - "firmness_numeric"  # Texture measurement (7.2% missing) 
    - "starch_numeric"    # Maturity indicator (0.8% missing)
    - "size_numeric"      # Size score (0% missing)
    - "season_numeric"    # Harvest timing (0% missing)
    # Excluding red_pct_numeric due to 25% missing data
    
    # Derived features added by dataset loader:
    # - "sweetness_ratio"  # Brix/acidity ratio
    # - "quality_index"    # Combined quality score
    # Additional features will be engineered in the experiment

model:
  type: "feedforward"
  architecture:
    input_dim: 10  # Number of features (5 base + 5 engineered)
    hidden_dims: [32, 16, 8]  # Smaller architecture for small dataset (3 layers required)
    output_dim: 3  # Number of quality routing classes (fresh_premium, fresh_standard, juice)
    activation: "relu"
    dropout_rate: 0.3  # Moderate dropout for small dataset
    batch_norm: true
    
training:
  epochs: 300  # Train until convergence
  batch_size: 16  # Smaller batch size for better generalization
  learning_rate: 0.005  # Moderate learning rate
  weight_decay: 0.001  # Increased L2 regularization
  optimizer: "adam"
  class_weights: true  # Handle class imbalance
  early_stopping:
    patience: 30  # Increased patience for full convergence
    min_delta: 0.001
  
clustering:
  method: "kmeans"
  k_selection: "combined"  # Triangulation: gap (30%), silhouette (40%), davies_bouldin (30%)
  k_min: 2
  k_max: 10  # Full range - let combined metrics decide optimal k per layer
  random_state: 42

llm:
  provider: "grok"  # openai, claude, grok, gemini
  model: "grok-3"  # Latest Grok model
  use_cache: true     # Cache LLM responses
  debug: true         # Show prompts/responses for testing
  optimization_level: 1  # Prompt optimization (0-3)
  analysis_categories:   # Types of analysis to perform
    - "interpretation"
    - "bias"
  
trajectory_analysis:
  windows:
    early: [0, 1]      # Layers 0-1
    middle: [1, 2]     # Layers 1-2  
    late: [2, 3]       # Layers 2-3
  fragmentation:
    compute: true
    threshold: 0.5  # For uncertainty flagging
    
visualization:
  sankey:
    height: 800  # Increased for better visibility
    width: 2000  # Increased to prevent cutoff
    top_n_paths: 25    # Show top 25 paths
    show_variety_labels: true
    color_by: "variety"  # Color paths by variety
  trajectory:
    method: "umap"
    n_components: 3
    min_dist: 0.1
    n_neighbors: 10  # Reduced for smaller dataset
  save_format: ["html", "png"]  # Skip PDF for testing
  
analysis:
  convergence:
    compute_pairwise: true  # Check all variety pairs
    focus_varieties: ["Honeycrisp", "Buckeye Gala", "Ambrosia"]
  economic:
    compute_impact: true
    variety_prices:  # $/lb estimates
      Honeycrisp: 2.50
      Ambrosia: 2.20
      "Zestar!": 1.80
      Macoun: 1.40
      "Buckeye Gala": 1.00
      Liberty: 1.20
      Blondee: 1.30
      "Lindamac McIntosh": 1.10
      Lindamac: 1.10
      Akane: 1.20

output:
  save_models: true
  save_activations: true
  save_trajectories: true
  figure_dir: "../../arxiv_apple/figures_test"
  results_format: "json"