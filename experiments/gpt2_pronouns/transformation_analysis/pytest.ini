[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for data flow
    slow: Slow tests that should be run separately
    
# Coverage settings
[coverage:run]
source = .
omit = 
    tests/*
    */__init__.py
    schema_usage_example.py
    
[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    @abstractmethod